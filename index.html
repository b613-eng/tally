<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f161d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Tally">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Daily Tally</title>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: one narrow column, three metric cards (calories, water, movement), then the day's log and a 7-day strip. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #14202b;
  --muted: #5d6b78;
  --line: #dde3e8;
  --track: #e6ebef;
  --cal: #d9730d;
  --water: #1c7ed6;
  --move: #2f9e6b;
  --danger: #b42318;
  --focus: #14202b;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161d; --surface: #17212b; --fg: #e8eef3; --muted: #93a1ae; --line: #263441;
    --track: #243240; --cal: #f09a3e; --water: #4aa3f0; --move: #4cc38a; --danger: #f97066; --focus: #e8eef3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161d; --surface: #17212b; --fg: #e8eef3; --muted: #93a1ae; --line: #263441;
  --track: #243240; --cal: #f09a3e; --water: #4aa3f0; --move: #4cc38a; --danger: #f97066; --focus: #e8eef3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; letter-spacing: -0.01em; }
h2 { font-size: 17px; }
.muted { color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { cursor: pointer; }

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.top p { margin: 2px 0 0; font-size: 13px; }

.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; background: var(--fg); color: var(--bg); font-weight: 600; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.cal { background: var(--cal); color: #fff; }
.btn.water { background: var(--water); color: #fff; }
.btn.move { background: var(--move); color: #fff; }
:root:not([data-theme="light"]) .btn.cal, :root:not([data-theme="light"]) .btn.water, :root:not([data-theme="light"]) .btn.move { color: #0b1117; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .btn.cal, :root:not([data-theme="dark"]) .btn.water, :root:not([data-theme="dark"]) .btn.move { color: #fff; } }
:root[data-theme="light"] .btn.cal, :root[data-theme="light"] .btn.water, :root[data-theme="light"] .btn.move { color: #fff; }
:root[data-theme="dark"] .btn.cal, :root[data-theme="dark"] .btn.water, :root[data-theme="dark"] .btn.move { color: #0b1117; }

.daynav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.daynav button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; }
.daynav button:disabled { opacity: 0.35; cursor: default; }
.daynav div { text-align: center; }
.daynav strong { display: block; font-family: var(--font-display); font-size: 20px; }
.daynav span { font-size: 13px; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-head span { font-size: 13px; }
.stat { display: flex; align-items: center; gap: 16px; min-width: 0; }
.ring { width: 96px; height: 96px; flex: none; }
.ring-t { font-family: var(--font-display); font-weight: 700; font-size: 20px; fill: var(--fg); }
.num { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.num strong { font-family: var(--font-display); font-size: 32px; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.num strong small { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.num span { font-size: 14px; color: var(--muted); }
.num .over { color: var(--danger); font-weight: 600; }

.glasses { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.glass { width: 22px; height: 28px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 500; font-variant-numeric: tabular-nums; }
.chip:hover { background: var(--track); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row input, .row select { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 12px; min-width: 0; }
.row .grow { flex: 1 1 140px; }
.row .small { flex: 0 1 110px; }
.row .btn { flex: none; }

.goals { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.goals form { display: flex; flex-direction: column; gap: 12px; }
.goals .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.goals label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.goals input { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 12px; color: var(--fg); min-width: 0; }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 10px 1fr auto auto; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.log li:first-child { border-top: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.log .what { min-width: 0; overflow-wrap: anywhere; }
.log .when { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log .x { min-width: 44px; min-height: 44px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; font-size: 13px; }
.log .x:hover { color: var(--danger); }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.day[aria-pressed="true"] { border-color: var(--fg); background: var(--track); }
.day .dn { font-size: 12px; color: var(--muted); }
.day .dd { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bars { display: flex; gap: 3px; align-items: flex-end; height: 44px; }
.bar { width: 6px; height: 100%; background: var(--track); border-radius: 3px; display: flex; align-items: flex-end; overflow: hidden; }
.day[aria-pressed="true"] .bar { background: var(--line); }
.bar i { display: block; width: 100%; border-radius: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.wl { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
details.more summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--muted); font-size: 14px; }
.wnote { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.foot { font-size: 12px; color: var(--muted); text-align: center; margin: 4px 0 0; }
.mission { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 14px; }
.mission .pips { display: flex; gap: 8px; flex: none; }
.pip { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.pip svg { width: 16px; height: 16px; }
.pip.on { color: var(--bg); border-color: transparent; }
.pip.cal.on { background: var(--cal); }
.pip.water.on { background: var(--water); }
.pip.move.on { background: var(--move); }
.mission .txt { min-width: 0; display: flex; flex-direction: column; }
.mission strong { font-family: var(--font-display); font-size: 16px; }
.mission .sub { font-size: 13px; color: var(--muted); }
.mission.done { border-color: var(--move); }
.mission.done strong { color: var(--move); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px 1px 6px; border-radius: 999px; border: 1.5px solid var(--c, var(--line)); color: var(--fg); font-size: 12px; font-weight: 600; margin-left: 6px; vertical-align: middle; }
.badge svg { color: var(--c); }
.mk { display: inline-flex; color: var(--move); margin-left: 2px; vertical-align: middle; }
.mk svg { width: 12px; height: 12px; }
.adv { border: 1px dashed var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.adv p { margin: 0; }
.adv .btn { min-height: 44px; font-size: 14px; text-align: left; line-height: 1.25; padding-block: 8px; height: auto; }
.toasts { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 12px max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.toast { background: var(--fg); color: var(--bg); border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 14px; text-align: center; max-width: 100%; }
.stampwrap { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; background: rgba(10, 16, 22, 0.45); }
.stampcard { background: var(--surface); border: 2px solid var(--move); border-radius: 20px; padding: 24px 28px; text-align: center; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 8px; transform: rotate(-2deg); }
.stampcard h2 { font-size: 26px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--move); }
.stampcard p { margin: 0 0 8px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 25; }
.confetti i { position: absolute; top: -16px; width: 8px; height: 14px; border-radius: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .ring circle:nth-of-type(2) { transition: stroke-dashoffset 0.4s ease; }
  @keyframes pop { from { transform: translateY(10px) scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes stampIn { from { transform: scale(1.5) rotate(-8deg); opacity: 0; } to { transform: rotate(-2deg) scale(1); opacity: 1; } }
  @keyframes draw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  .toast { animation: pop 0.25s ease both; }
  .stampcard { animation: stampIn 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
  .stampcard .tick { stroke-dasharray: 60; animation: draw 0.5s 0.25s ease both; }
  .confetti i { animation-name: fall; animation-timing-function: linear; animation-fill-mode: forwards; }
  .pip { transition: background 0.3s; }
}
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Daily Tally</h1>
      <p class="muted">Calories, water and movement for the day.</p>
    </div>
    <div class="row" style="flex:none;flex-wrap:nowrap">
      <button class="btn ghost" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
      <button class="btn ghost" id="goalsBtn" type="button" aria-expanded="false" aria-controls="goalsPanel">Goals</button>
    </div>
  </header>

  <section class="goals" id="goalsPanel" hidden>
    <form id="goalsForm">
      <div class="fields">
        <label for="gCal">Calories (kcal)<input id="gCal" type="number" inputmode="numeric" min="1" max="20000"></label>
        <label for="gWater">Water (glasses)<input id="gWater" type="number" inputmode="numeric" min="1" max="40"></label>
        <label for="gMove">Movement (minutes)<input id="gMove" type="number" inputmode="numeric" min="1" max="1440"></label>
      </div>
      <div class="row"><button class="btn" type="submit">Save goals</button></div>
    </form>
  </section>

  <nav class="daynav" aria-label="Choose day">
    <button id="prev" type="button" aria-label="Previous day">&lsaquo;</button>
    <div><strong id="dayLabel"></strong><span id="dayDate"></span></div>
    <button id="next" type="button" aria-label="Next day">&rsaquo;</button>
  </nav>

  <section class="mission" id="mission"></section>

  <section class="card" aria-labelledby="hCal">
    <div class="card-head"><h2 id="hCal">Calories</h2><span class="muted" id="calGoal"></span></div>
    <div class="stat">
      <div id="calRing"></div>
      <div class="num"><strong id="calNum"></strong><span id="calSub"></span></div>
    </div>
    <div class="chips">
      <button class="chip" type="button" data-add="cal" data-v="100">+100</button>
      <button class="chip" type="button" data-add="cal" data-v="250">+250</button>
      <button class="chip" type="button" data-add="cal" data-v="500">+500</button>
    </div>
    <form class="row" id="calForm">
      <input class="small" id="calIn" type="number" inputmode="numeric" min="1" max="10000" placeholder="kcal" aria-label="Calories to add" required>
      <input class="grow" id="calNote" type="text" maxlength="60" placeholder="What was it? (optional)" aria-label="Meal note">
      <button class="btn cal" type="submit">Add</button>
    </form>
    <div class="adv" id="calAdv" hidden></div>
  </section>

  <section class="card" aria-labelledby="hWater">
    <div class="card-head"><h2 id="hWater">Water</h2><span class="muted" id="waterGoal"></span></div>
    <div class="stat">
      <div class="num"><strong id="waterNum"></strong><span id="waterSub"></span></div>
    </div>
    <div class="glasses" id="glasses" aria-hidden="true"></div>
    <div class="row">
      <button class="btn water" id="waterPlus" type="button">Add a glass</button>
      <button class="btn ghost" id="waterMinus" type="button">Remove one</button>
    </div>
    <div class="adv" id="waterAdv" hidden></div>
  </section>

  <section class="card" aria-labelledby="hMove">
    <div class="card-head"><h2 id="hMove">Walking and exercise</h2><span class="muted" id="moveGoal"></span></div>
    <div class="stat">
      <div id="moveRing"></div>
      <div class="num"><strong id="moveNum"></strong><span id="moveSub"></span></div>
    </div>
    <div class="chips">
      <button class="chip" type="button" data-add="move" data-v="10" data-note="Walk">+10 min walk</button>
      <button class="chip" type="button" data-add="move" data-v="20" data-note="Walk">+20 min walk</button>
      <button class="chip" type="button" data-add="move" data-v="30" data-note="Workout">+30 min workout</button>
    </div>
    <form class="row" id="moveForm">
      <input class="small" id="moveIn" type="number" inputmode="numeric" min="1" max="1440" placeholder="minutes" aria-label="Minutes to add" required>
      <select class="small" id="moveKind" aria-label="Type of activity">
        <option>Walk</option>
        <option>Workout</option>
      </select>
      <button class="btn move" type="submit">Add</button>
    </form>
    <div class="adv" id="moveAdv" hidden></div>
  </section>

  <section class="card" aria-labelledby="hWeight">
    <div class="card-head"><h2 id="hWeight">Weight</h2><span class="muted" id="weightMeta"></span></div>
    <div class="stat">
      <div class="num"><strong id="weightNum"></strong><div class="wnote" id="weightSub"></div></div>
    </div>
    <div id="weightChart"></div>
    <form class="row" id="weightForm">
      <input class="small" id="weightIn" type="number" inputmode="decimal" step="0.1" min="20" max="500" placeholder="weight" aria-label="Weight" required>
      <select class="small" id="weightUnit" aria-label="Unit">
        <option value="kg">kg</option>
        <option value="lb">lb</option>
      </select>
      <button class="btn" type="submit">Save weight</button>
    </form>
    <details class="more">
      <summary>Target weight (optional)</summary>
      <form class="row" id="targetForm">
        <input class="small" id="targetIn" type="number" inputmode="decimal" step="0.1" min="20" max="500" placeholder="target" aria-label="Target weight">
        <button class="btn ghost" type="submit">Save target</button>
      </form>
    </details>
  </section>

  <section class="card" aria-labelledby="hLog">
    <h2 id="hLog">Log</h2>
    <ul class="log" id="log"></ul>
  </section>

  <section class="card" aria-labelledby="hWeek">
    <h2 id="hWeek">Last 7 days</h2>
    <div class="week" id="week"></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--cal)"></i>Calories</span>
      <span><i class="dot" style="background:var(--water)"></i>Water</span>
      <span><i class="dot" style="background:var(--move)"></i>Movement</span>
    </div>
  </section>

  <p class="foot" id="syncNote"></p>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="stampwrap" id="stamp" hidden>
    <div class="stampcard" role="status">
      <svg viewBox="0 0 72 72" width="72" height="72" fill="none" stroke="var(--move)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="36" cy="36" r="30"/><path class="tick" d="M22 37l9 9 19-20"/></svg>
      <h2>Mission accomplished</h2>
      <p class="muted" id="stampSub"></p>
      <button class="btn" id="stampClose" type="button">Nice</button>
    </div>
  </div>
</main>

<script>
(function () {
  var KEY = 'daily-tally-v1';
  var DEFAULT_GOALS = { cal: 2000, water: 8, move: 30 };
  var COLORS = { cal: 'var(--cal)', water: 'var(--water)', move: 'var(--move)' };

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return fmt(d); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(n) { return Number(n).toLocaleString(); }
  var $ = function (s) { return document.querySelector(s); };

  var today = fmt(new Date());
  var sel = today;

  function load() {
    try {
      var r = JSON.parse(localStorage.getItem(KEY));
      if (r && r.goals && r.days) return r;
    } catch (e) {}
    return { goals: Object.assign({}, DEFAULT_GOALS), days: {} };
  }
  var state = load();
  state.adj = state.adj || {};
  state.plans = state.plans || {};
  state.bank = state.bank || 0;
  state.banked = state.banked || {};
  state.weights = Array.isArray(state.weights) ? state.weights : [];
  state.unit = state.unit === 'lb' ? 'lb' : 'kg';
  state.targetKg = typeof state.targetKg === 'number' ? state.targetKg : null;
  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  /* ---- optional sync to the viewer's private store ---- */
  var col = null;
  var queues = {};
  var migrated = false;
  function setNote(synced) {
    $('#syncNote').textContent = synced ? 'Saved to your account and this device.' : 'Saved on this device only.';
  }
  function enqueue(key, fn) {
    queues[key] = (queues[key] || Promise.resolve()).then(fn).catch(function () { setNote(false); });
  }
  function pushDay(date) {
    if (!col) return;
    var entries = (state.days[date] || []).slice();
    enqueue('d-' + date, function () { return col.doc('d-' + date).set({ date: date, entries: entries }); });
  }
  function pushGoals() {
    if (!col) return;
    var goals = Object.assign({}, state.goals);
    enqueue('goals', function () { return col.doc('goals').set({ goals: goals }); });
  }
  function pushMeta() {
    if (!col) return;
    var copy = JSON.parse(JSON.stringify({ adj: state.adj, plans: state.plans, bank: state.bank, banked: state.banked, weights: state.weights, unit: state.unit, targetKg: state.targetKg }));
    enqueue('meta', function () { return col.doc('meta').set(copy); });
  }

  /* ---- data helpers ---- */
  function entriesOf(date) { return state.days[date] || []; }
  function total(date, k) {
    return entriesOf(date).reduce(function (a, e) { return e.k === k ? a + e.v : a; }, 0);
  }
  function add(k, v, note) {
    v = Math.round(Number(v));
    if (!(v > 0)) return;
    if (k === 'cal') v = Math.min(v, 10000);
    if (k === 'move') v = Math.min(v, 1440);
    var before = flags(sel);
    var list = (state.days[sel] = (state.days[sel] || []).slice());
    list.push({ id: Math.random().toString(36).slice(2, 10), k: k, v: v, note: note || '', t: Date.now() });
    saveLocal(); pushDay(sel); render();
    celebrate(before, flags(sel));
  }
  function removeEntry(id) {

  }
  function removeLastWater() {

    }
  }

  /* ---- goals, targets and streaks ---- */
  var CHECK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

    };

  /* ---- sound ---- */

  /* ---- celebration ---- */

  var stampTimer = null;

  function celebrate(b, a) {

    var newly = ['cal', 'water', 'move'].filter(function (k) { return !b.m[k] && a.m[k]; });

  }

  /* ---- gentle plans for going over, and banked bonus minutes ---- */
  function walkMinutes(over) { return Math.min(60, Math.max(10, Math.round(over / 25) * 5)); }
  function spreadAmount(over, goal) { return Math.max(10, Math.round(Math.min(over, goal * 0.3) / 3 / 10) * 10); }
  function bumpAdj(date, k, v) {
    var a = (state.adj[date] = Object.assign({}, state.adj[date]));
    a[k] = (a[k] || 0) + v;
    if (!a[k]) delete a[k];
  }
  function applyPlan(type) {
    if (state.plans[sel]) return;
    var goal = goalFor(sel, 'cal'), over = total(sel, 'cal') - goal;
    if (over <= 0) return;
    if (type === 'walk') {
      var m = walkMinutes(over);
      bumpAdj(sel, 'move', m);
      state.plans[sel] = { type: 'walk', min: m };
    } else {
      var d = spreadAmount(over, goal), days = [1, 2, 3].map(function (i) { return addDays(sel, i); });
      days.forEach(function (x) { bumpAdj(x, 'cal', -d); });
      state.plans[sel] = { type: 'spread', d: d, days: days };
    }
    saveLocal(); pushMeta(); render();
  }
  function undoPlan() {
    var p = state.plans[sel];
    if (!p) return;
    if (p.type === 'walk') bumpAdj(sel, 'move', -p.min);
    else p.days.forEach(function (x) { bumpAdj(x, 'cal', p.d); });
    delete state.plans[sel];
    saveLocal(); pushMeta(); render();
  }
  function bankAction(kind, n) {
    n = Math.round(Number(n));
    if (!(n > 0)) return;
    if (kind === 'save') {
      state.bank += n;
      state.banked[sel] = (state.banked[sel] || 0) + n;
      saveLocal(); pushMeta(); render();
    } else if (kind === 'use') {
      n = Math.min(n, state.bank);
      state.bank -= n;
      saveLocal(); pushMeta();
      add('move', n, 'Banked');
    }
  }

  /* ---- weight: stored in kg, shown in the chosen unit ---- */
  var LB = 2.20462;
  function toKg(n) { return state.unit === 'lb' ? n / LB : n; }
  function fromKg(kg) { return state.unit === 'lb' ? kg * LB : kg; }
  function fmtW(kg) {
    return (Math.round(fromKg(kg) * 10) / 10).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }
  function dayLabel(s) { return parse(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
  function saveWeight(val) {
    var n = Number(val);
    if (!(n > 0)) return;
    var kg = Math.round(toKg(n) * 100) / 100;
    if (kg < 20 || kg > 500) return;
    state.weights = state.weights.filter(function (w) { return w.date !== sel; })
      .concat([{ date: sel, kg: kg }])
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    saveLocal(); pushMeta(); render(); toast('Weight saved');
  }
  function removeWeight() {
    state.weights = state.weights.filter(function (w) { return w.date !== sel; });
    saveLocal(); pushMeta(); render();
  }
  function weightChart() {
    var pts = state.weights.filter(function (w) { return w.date <= sel; }).slice(-12);
    if (pts.length < 2) return '';
    var vals = pts.map(function (p) { return fromKg(p.kg); });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), span = (mx - mn) || 1;
    var lo = mn - span * 0.3, hi = mx + span * 0.3;
    var W = 300, H = 100, L = 16, R = 16, T = 20, B = 26, n = pts.length;
    var t0 = parse(pts[0].date).getTime(), t1 = parse(pts[n - 1].date).getTime();
    function X(i) { return L + (parse(pts[i].date).getTime() - t0) / (t1 - t0) * (W - L - R); }
    function Y(v) { return T + (1 - (v - lo) / (hi - lo)) * (H - T - B); }
    var path = vals.map(function (v, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ');
    var dots = vals.map(function (v, i) {
      return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="' + (i === n - 1 ? 4 : 2.5) + '" style="fill:var(--fg)"/>';
    }).join('');

      '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" style="stroke:var(--line)"/>' +
      '<path d="' + path + '" fill="none" style="stroke:var(--fg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' + dots +
      '<text x="' + L + '" y="' + (Y(vals[0]) - 9).toFixed(1) + '" class="wl">' + f(vals[0]) + '</text>' +
      '<text x="' + (W - R) + '" y="' + (Y(vals[n - 1]) - 9).toFixed(1) + '" text-anchor="end" class="wl">' + f(vals[n - 1]) + '</text>' +
      '<text x="' + L + '" y="' + (H - 8) + '" class="wl">' + dayLabel(pts[0].date) + '</text>' +
      '<text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end" class="wl">' + dayLabel(pts[n - 1].date) + '</text></svg>';
  }
  function renderWeight() {
    var u = state.unit;
    var list = state.weights.filter(function (w) { return w.date <= sel; });
    var last = list[list.length - 1], prev = list[list.length - 2];
    $('#weightUnit').value = u;
    $('#weightIn').placeholder = u;
    var numEl = $('#weightNum'), sub = $('#weightSub'), meta = $('#weightMeta'), h = '';
    if (!last) {
      numEl.innerHTML = '&mdash;';
      h = '<span class="muted">Weigh in once a week to see your trend. Same time of day each time works best.</span>';
    } else {
      numEl.innerHTML = fmtW(last.kg) + ' <small>' + u + '</small>';
      var days = Math.round((parse(sel).getTime() - parse(last.date).getTime()) / 86400000);

      else h += '<span class="muted">Last logged ' + days + ' day' + (days === 1 ? '' : 's') + ' before this day.</span>';

  function renderMission() {
    var m = metOf(sel), n = (m.cal ? 1 : 0) + (m.water ? 1 : 0) + (m.move ? 1 : 0), done = n === 3, left = [];

  function renderAdv() {

          '<button class="btn ghost" type="button" data-plan="spread">Ease it over 3 days: ' + d + ' kcal less each day</button></div>' +

      wh = '<p><strong>+' + x + ' bonus glass' + (x === 1 ? '' : 'es') + '.</strong> ' + (x >= 4 ? 'That is plenty for today. Go by thirst from here.' : 'Nicely hydrated.') + '</p>';
    }

      if (can > 0) mh += '<div class="row"><button class="btn ghost" type="button" data-bank="save" data-n="' + can + '">Bank ' + can + ' min</button></div>';
    }

  /* ---- drawing ---- */
  function ring(p, color, label) {
    var c = 2 * Math.PI * 44;

    return '<svg class="ring" viewBox="0 0 100 100" role="img" aria-label="' + esc(label) + '">' +

      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - q)).toFixed(1) + '" transform="rotate(-90 50 50)"/>' +

  function dayTitle(s) {

  function render() {

    $('#moveRing').innerHTML = ring(move / g.move, COLORS.move, 'Movement: ' + Math.round(move / g.move * 100) + ' percent of goal');

  /* ---- events ---- */
  document.addEventListener('click', function (e) {

  $('#calForm').addEventListener('submit', function (e) {

  $('#moveForm').addEventListener('submit', function (e) {
    e.preventDefault();
    add('move', $('#moveIn').value, $('#moveKind').value);
    $('#moveIn').value = '';
  });
  $('#goalsBtn').addEventListener('click', function () {
    var p = $('#goalsPanel'), open = p.hidden;
    p.hidden = !open;
    this.setAttribute('aria-expanded', String(open));
    if (open) {
      $('#gCal').value = state.goals.cal; $('#gWater').value = state.goals.water; $('#gMove').value = state.goals.move;
    }
  });
  $('#goalsForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var c = Math.round(Number($('#gCal').value)), w = Math.round(Number($('#gWater').value)), m = Math.round(Number($('#gMove').value));
    if (c > 0 && w > 0 && m > 0) {
      state.goals = { cal: c, water: w, move: m };
      saveLocal(); pushGoals();
      $('#goalsPanel').hidden = true;
      $('#goalsBtn').setAttribute('aria-expanded', 'false');
      render();
    }
  });
  document.addEventListener('visibilitychange', function () {
    var now = fmt(new Date());
    if (!document.hidden && now !== today) {
      if (sel === today) sel = now;
      today = now; render();
    }
  });

  function setSoundBtn() {
    var b = $('#soundBtn');
    b.textContent = soundOn ? 'Sound on' : 'Sound off';
    b.setAttribute('aria-pressed', String(soundOn));
  }
  $('#soundBtn').addEventListener('click', function () {
    soundOn = !soundOn;
    try { localStorage.setItem('daily-tally-sound', soundOn ? 'on' : 'off'); } catch (e) {}
    setSoundBtn();
    if (soundOn) playTick();
  });
  $('#stampClose').addEventListener('click', hideStamp);
  $('#stamp').addEventListener('click', function (e) { if (e.target === this) hideStamp(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideStamp(); });

  $('#weightForm').addEventListener('submit', function (e) {
    e.preventDefault();
    saveWeight($('#weightIn').value);
    $('#weightIn').value = '';
  });
  $('#weightUnit').addEventListener('change', function () {
    state.unit = this.value === 'lb' ? 'lb' : 'kg';
    saveLocal(); pushMeta(); render();
  });
  $('#targetForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var raw = $('#targetIn').value, n = Number(raw);
    if (raw === '') state.targetKg = null;
    else if (n > 0) { var kg = Math.round(toKg(n) * 100) / 100; if (kg < 20 || kg > 500) return; state.targetKg = kg; }
    else return;
    $('#targetIn').value = '';
    saveLocal(); pushMeta(); render(); toast(state.targetKg ? 'Target saved' : 'Target cleared');
  });

  setSoundBtn();
  setNote(false);
  render();

  /* ---- connect the private store when this view has one ---- */
  (async function () {
    try {
      if (!window.claude || !window.claude.use) return;
      var user = await window.claude.use('user');
      var uid = user ? await user.id() : null;
      var db = await window.claude.use('db');
      if (!uid || !db) return;
      var c = db.collection('data/users/' + uid);
      c.onSnapshot(function (snap) {
        var remoteDays = {}, hasGoals = false, hasMeta = false;
        snap.docs.forEach(function (d) {
          var v = d.data() || {};
          if (d.id === 'goals' && v.goals) { hasGoals = true; state.goals = Object.assign({}, DEFAULT_GOALS, v.goals); }
          else if (d.id === 'meta') {
            hasMeta = true;
            state.adj = v.adj || {}; state.plans = v.plans || {};
            state.bank = typeof v.bank === 'number' ? v.bank : 0; state.banked = v.banked || {};
            if (Array.isArray(v.weights)) state.weights = v.weights;
            if (v.unit === 'kg' || v.unit === 'lb') state.unit = v.unit;
            if (typeof v.targetKg === 'number' || v.targetKg === null) state.targetKg = v.targetKg;
          }
          else if (d.id.indexOf('d-') === 0 && v.date) { remoteDays[v.date] = true; state.days[v.date] = Array.isArray(v.entries) ? v.entries : []; }
        });
        col = c;
        if (!migrated && !snap.metadata.fromCache) {
          migrated = true;
          Object.keys(state.days).forEach(function (date) { if (!remoteDays[date] && state.days[date].length) pushDay(date); });
          var gl = state.goals;
          if (!hasGoals && (gl.cal !== DEFAULT_GOALS.cal || gl.water !== DEFAULT_GOALS.water || gl.move !== DEFAULT_GOALS.move)) pushGoals();
          if (!hasMeta && (Object.keys(state.adj).length || Object.keys(state.plans).length || state.bank || Object.keys(state.banked).length || state.weights.length)) pushMeta();
        }
        saveLocal(); setNote(true); render();
      }, function () { col = null; setNote(false); });
    } catch (e) { setNote(false); }
  })();
})();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
</body>
</html>
